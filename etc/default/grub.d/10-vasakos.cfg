# La identidad de VasakOS en el menú de arranque.
#
# El paquete `grub` de Arch trae /etc/default/grub con GRUB_DISTRIBUTOR="Arch",
# y ese valor le gana a /etc/os-release y a `lsb_release`: `10_linux` sólo los
# consulta cuando GRUB_DISTRIBUTOR está vacío. Por eso un VasakOS recién
# instalado mostraba «Arch Linux» en el menú de arranque.
#
# Va como drop-in y no editando /etc/default/grub porque ese archivo lo posee el
# paquete `grub`: escribirlo desde otro paquete es un conflicto que hace fallar
# el pacstrap, y editarlo a mano se pierde en la próxima actualización.
# `grub-mkconfig` lee /etc/default/grub y **después** este directorio, así que
# lo de acá pisa lo de allá — es el mecanismo previsto para esto.
GRUB_DISTRIBUTOR="VasakOS"

# AppArmor, apagado por omisión en el kernel de Arch.
#
# El kernel lo trae compilado (CONFIG_SECURITY_APPARMOR=y) pero fuera de la
# lista que se activa al arrancar: CONFIG_LSM vale
# "landlock,lockdown,yama,integrity,bpf". La única forma de sumarlo es por la
# línea de arranque, y hay que repetir las cinco que ya estaban —`lsm=` no
# agrega, **reemplaza** la lista entera—. Escribir sólo `lsm=apparmor` dejaría
# el sistema sin Landlock y sin Yama sin que nadie lo note.
#
# Esto por sí solo no confina nada: sin perfiles cargados todos los programas
# quedan «unconfined», exactamente como hoy. Es la base para poder empezar a
# escribir perfiles, que es lo que sí cambia el comportamiento y va de a uno.
#
# Va en GRUB_CMDLINE_LINUX y no en ..._DEFAULT a propósito: `_DEFAULT` no se
# aplica a la entrada de recuperación, y un modo donde el sistema arranca sin
# sus mecanismos de seguridad es justo donde no los querés apagados.
#
# Se agrega al valor que ya venga en /etc/default/grub en lugar de pisarlo:
# grub-mkconfig lee ese archivo primero y este directorio después, en el mismo
# shell, así que la variable ya está definida cuando se llega acá.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} lsm=landlock,lockdown,yama,integrity,bpf,apparmor"

# Que el menú muestre los otros sistemas operativos del equipo.
#
# Desde GRUB 2.06 `os-prober` viene **desactivado por omisión** —Arch trae hoy
# 2.14—, así que `grub-mkconfig` no lo corre y el menú sale con VasakOS y nada
# más. En un equipo donde alguien instaló al lado de su Windows, eso se ve como
# que la instalación se lo comió: el disco está intacto, pero no hay forma de
# arrancarlo sin entrar al firmware.
#
# El instalador ya elige GRUB en parte por esto —«es el que detecta otros
# sistemas con os-prober», dice su comentario— y ese motivo no se estaba
# cumpliendo.
#
# Lo que cuesta: `grub-mkconfig` monta cada partición ajena para mirar qué hay
# adentro, así que tarda unos segundos más en cada actualización de kernel. En
# un equipo de un solo sistema no cambia nada más que eso.
GRUB_DISABLE_OS_PROBER=false
