# Cuánto diario se guarda.
#
# El tope de fábrica en este sistema es `SystemMaxUse=50M`, y no es nuestro:
# viene de `/usr/lib/systemd/journald.conf.d/00-journal-size.conf`, de
# `cachyos-settings`. Es un tope razonable para un sistema que registra poco.
#
# VasakOS no registra poco. Corre 1592 perfiles de AppArmor en modo aviso y
# además apaga el límite de `printk` a propósito —ver
# `sysctl.d/50-vasakos-auditoria.conf`, que existe porque ese límite descartaba
# el 96% de los registros y con ellos las denegaciones de verdad—. Las dos cosas
# están bien; juntas, con 50 MB no entra **un día**.
#
# Con los perfiles ruidosos afuera (ver `apparmor/ignore.d/50-vasakos-ruido.conf`)
# quedan unos 8,4 MB por día, así que una semana son ~59 MB y el tope de 50
# seguiría cortándola por poco. 500 MB deja la semana con lugar de sobra y da
# margen para un arranque que falle a los gritos, que es cuando el diario hace
# falta de verdad.
#
# `SystemMaxFileSize` va a la décima parte, que es lo que systemd usa por
# omisión: archivos más chicos hacen que rotar tire menos historia de una vez.
#
# El nombre empieza con 50 para que gane: systemd lee los fragmentos en orden
# alfabético y `/etc` le gana a `/usr/lib` sólo cuando el nombre es el mismo.
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
