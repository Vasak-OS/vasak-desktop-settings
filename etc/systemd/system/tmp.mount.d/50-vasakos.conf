# `/tmp` montado con `nodev` y `nosuid`.
#
# El `tmp.mount` que trae systemd ya monta `/tmp` como tmpfs con `nodev,nosuid`.
# Pero `cachyos-settings` lo pisa con `defaults,noatime,mode=1777`, que los saca:
# en un equipo que venga de CachyOS, `/tmp` queda sin ellos. Este drop-in vuelve
# a fijarlos para que no dependan de qué otro paquete haya tocado la unidad —el
# mismo criterio que `50-vasakos-ptrace.conf`—.
#
# `Options=` en un drop-in de montaje REEMPLAZA, no suma, así que hay que repetir
# la lista entera: son los valores del `tmp.mount` de systemd.
#
# `noexec` a propósito NO va: VasakOS corre AppImages y hay instaladores que
# ejecutan desde `/tmp`; ponerlo rompe eso. `nodev` y `nosuid` no tienen ese
# costo —en un directorio temporal nadie necesita nodos de dispositivo ni el bit
# setuid—.
[Mount]
Options=mode=1777,strictatime,nodev,nosuid,size=50%,nr_inodes=1m
