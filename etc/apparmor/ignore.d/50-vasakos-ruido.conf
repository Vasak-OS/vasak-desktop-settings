# Perfiles que no se instalan porque sólo hacen ruido.
#
# ── El problema ──────────────────────────────────────────────────────────────
#
# Los 1592 perfiles del paquete entran en **modo aviso**: no bloquean nada y
# anotan todo lo que habrían bloqueado. Esa anotación es el punto —de ahí sale
# qué perfiles pueden pasar a hacer cumplir— pero cinco de ellos la escriben en
# un volumen que se come el diario entero.
#
# Medido sobre un arranque de 15,5 h de uso normal, como porcentaje del diario
# **completo**, no sólo de lo de AppArmor:
#
#   git ........................................ 5,79 MB   41,6%
#   dockerd .................................... 2,62 MB   18,8%
#   containerd-shim-runc-v2 -> runc ............ 2,55 MB   18,3%
#   gitstatusd ................................. 0,14 MB    1,0%
#
# En total, 78% de las líneas y 87% de los bytes del diario son AppArmor, y
# 38.247 de esas 38.249 líneas dicen «ALLOWED»: cosas que se permitieron.
#
# Con eso, y con un tope de 50 MB, un equipo de una semana de uso guarda **un
# solo arranque**. La semana de diario de la que depende el plan de
# `flags.d/50-vasakos.conf` para pasar perfiles a enforce no puede juntarse.
#
# ── Por qué no se pierde protección ──────────────────────────────────────────
#
# Conviene decirlo claro porque suena a lo contrario: en modo aviso un perfil
# **no bloquea nada**. Hoy `git` y `dockerd` corren sin confinar, y con esto
# siguen exactamente igual de sin confinar. Lo único que se deja de tener es el
# registro de lo que habrían bloqueado, que es justo lo que tapa el registro de
# todo lo demás.
#
# Tampoco son candidatos a enforce en ninguna tanda cercana: `git` recorre el
# disco por diseño y `dockerd`/`containerd` necesitan privilegios amplios. Su
# modo aviso no enseña nada sobre el escritorio, que es de lo que trata el plan.
#
# ── Cómo volver atrás ────────────────────────────────────────────────────────
#
# Borrando la línea y corriendo `aa-install --install --complain`. No hay estado
# que migrar: el perfil se instala o no se instala.
#
# Formato: un perfil por línea; también acepta un directorio del árbol de
# fuentes. Ver `aa-install --help`.

git
gitstatusd
dockerd
containerd-shim-runc-v2
