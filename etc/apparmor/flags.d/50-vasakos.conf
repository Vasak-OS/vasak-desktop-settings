# Qué perfiles del sistema hacen cumplir de verdad, y no sólo avisan.
#
# ── Por qué no están todos ───────────────────────────────────────────────────
#
# El paquete de perfiles trae más de mil quinientos y se instalan en modo aviso:
# anotan lo que habrían bloqueado y no bloquean nada. Son perfiles escritos
# afuera que nunca corrieron en VasakOS, y uno mal ajustado no se ve como
# seguridad — se ve como un programa que dejó de andar.
#
# Lo que faltaba para poder pasarlos a enforce era la vía de desbloqueo, y ya
# está: cuando un perfil niega algo aparece un aviso con el nombre del programa
# y el archivo, y se puede permitir desde ahí o desde Privacidad y seguridad.
#
# Aun así se pasan por tandas y no de golpe. Que carguen sin caídas está medido;
# que el escritorio funcione con ellos **haciendo cumplir** no. Son dos cosas
# distintas y sólo la primera se probó.
#
# ── Cómo se eligió esta primera tanda ────────────────────────────────────────
#
# De los 1590 perfiles disponibles, 16 corresponden a paquetes que VasakOS
# instala. De esos 16 se tomaron los que cumplen las tres cosas:
#
#   1. Confinarlos vale algo. `plocate` recorre el disco entero; `logrotate`
#      corre como root sobre los registros; `reflector` sale a la red y escribe
#      configuración del sistema.
#   2. Si se rompen, se nota y el daño está acotado. Ninguno está en el camino
#      de que la sesión abra ni de que el escritorio funcione.
#   3. No los usa nada más para arrancar.
#
# Quedan **afuera a propósito**, aunque tengan perfil y los instalemos:
#
#   pipewire, pipewire-pulse, wireplumber ...... romperlos deja el equipo mudo
#   xdg-desktop-portal, xdg-desktop-portal-gtk . es por donde pasan los permisos
#   cryptsetup ................................. está en el arranque del disco
#   upower, power-profiles-daemon .............. batería y energía
#   ffmpeg, pinentry, ntfs-3g, plocate y demás . los usa demasiado otra cosa
#
# Ésos entran cuando haya una semana de diario en máquinas reales que diga qué
# habrían bloqueado. Antes de eso sería adivinar.
#
# ── Segunda tanda, y de dónde salió ──────────────────────────────────────────
#
# Esa semana ya existe: ocho días de diario en un equipo de uso normal
# —2026-09-16 al 24—, con 271 546 registros de lo que los perfiles en modo
# aviso habrían bloqueado. Casi todo es de software que VasakOS no instala
# —containerd y docker 132 000, Chrome 34 000, git 23 000—, así que lo que
# decide es el recorte a los perfiles que sí instalamos:
#
#   upower ......................  0 registros, arrancó 10 veces
#   power-profiles-daemon .......  0 registros, arrancó 10 veces
#   xdg-desktop-portal ..........  0 registros, activo todo el tiempo
#   pipewire-pulse ..............  0 registros, activo todo el tiempo
#   xdg-desktop-portal-gtk ...... 48
#   pipewire .................... 47
#   wireplumber ................. 200
#   ffmpeg ...................... 1083
#   pinentry .................... 1390
#
# De los cuatro que no anotaron nada entran **dos**: `upower` y
# `power-profiles-daemon`. Cumplen la condición que los otros dos no cumplen —si
# se rompen, el daño está acotado: se ve mal la batería—. El portal es por donde
# pasan los permisos y `pipewire-pulse` es por donde pasa todo el audio; que no
# hayan anotado nada en ocho días es necesario y no alcanza, y entran en la
# tanda siguiente, después de que éstos dos hayan estado en enforce una semana.
#
# ── Lo que la medición encontró y no se esperaba ─────────────────────────────
#
# **`pipewire` no puede ir a enforce todavía, y el motivo es nuestro.** Sus 47
# registros son todos el mismo archivo:
#
#     operation="open"|"file_lock"|"mknod"|"unlink"
#     name="/run/user/1000/pipewire-0-priv.lock"
#
# El perfil de `apparmor.d` no conoce el socket privilegiado, que es el que
# VasakOS agregó para que el portal pueda conceder la cámara. En enforce le
# negaríamos a PipeWire el candado de su propio socket, o sea que romperíamos
# justo el camino que la etapa 2 abrió. Se arregla agregando esa ruta al perfil
# —no sacando el socket—, y eso es un cambio en el perfil, no una línea acá.
#
# **Los 7 «negado» de `plocate` no son de `plocate`.** Vienen con `comm="aa-exec"`
# y `comm="pw-mon"`: son las pruebas del 21/09 que midieron que cualquiera puede
# reclamar la etiqueta de otro perfil (ver Vasak-OS/vasak-permissions#69). O sea
# que la primera tanda no rompió nada en ocho días: `logrotate` y `reflector`
# tampoco anotaron un solo registro.
#
# ── Cómo agregar uno ─────────────────────────────────────────────────────────
#
# Una línea por perfil: «<nombre-del-perfil> enforce». El nombre es el del
# archivo en /usr/share/apparmor.d, que no siempre es el del paquete.
#
# Este archivo le gana al del paquete: `aa-install` lee primero
# /usr/share/apparmor/flags.d y después éste, y lo de acá pisa. Y le gana
# también al `--complain` del hook de pacman, que fija el modo por omisión
# **salvo** para los perfiles que un flags.d ya nombra.

plocate enforce
logrotate enforce
reflector enforce

# Segunda tanda: cero registros en ocho días y daño acotado si se rompen.
upower enforce
power-profiles-daemon enforce
