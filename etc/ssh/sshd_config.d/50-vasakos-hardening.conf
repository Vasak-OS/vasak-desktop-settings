# Endurecimiento del servidor SSH.
#
# VasakOS no entregaba ninguna config de `sshd`: en un equipo que instalara
# `openssh` regían los defaults del upstream, que para un escritorio son flojos.
# Este drop-in los ajusta. `sshd` no se habilita solo en el escritorio, así que
# esto sólo pesa el día que alguien enciende el servicio; por eso mismo conviene
# que para entonces ya esté puesto.
#
# Los archivos de `sshd_config.d/` se incluyen al principio de `sshd_config`, y
# `sshd` toma el primer valor de cada opción: lo que se fija acá gana sobre el
# default comentado de más abajo.
#
# A propósito NO se toca `PasswordAuthentication`: apagarlo deja afuera a quien
# entre por SSH con contraseña, y esa es una decisión del usuario, no de la
# distribución.

# root no entra por SSH, ni con clave. Que administre quien ya tiene su cuenta y
# escale con sudo; así cada acción queda atada a una persona.
PermitRootLogin no

# Treinta segundos para autenticarse. El default (2 min) deja conexiones a medio
# abrir ocupando ranuras, que es con lo que se hace un agotamiento de conexiones.
LoginGraceTime 30

# Cierra la sesión inactiva: un sondeo cada 5 min y, tras dos sin respuesta
# (~10 min), se corta. Recupera sesiones colgadas y no deja terminales abiertas
# en un equipo sin vigilancia.
ClientAliveInterval 300
ClientAliveCountMax 2
