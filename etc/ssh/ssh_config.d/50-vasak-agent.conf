# La clave se agrega al agente la primera vez que se usa, en vez de pedir la
# frase en cada conexión. El agente lo administra systemd; VasakOS exporta
# SSH_AUTH_SOCK al iniciar la sesión.
#
# Dura lo que dure la sesión: al reiniciar se vuelve a pedir una vez. Para que
# no la pida nunca más hace falta guardarla en el llavero, que es otra cosa.
Host *
    AddKeysToAgent yes
