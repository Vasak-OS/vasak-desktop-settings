# Core options ─────────────────────────────────────────────────────────────────
[core]

# Enabled plugins. Trimmed to what VasakOS actually uses: window management,
# the vasak-desktop IPC integration (ipc/ipc-rules/stipc/foreign-toplevel/
# window-rules/gtk-shell/wayfire-shell), idle+session-lock for screen locking,
# and a little animation/blur for the look. Pure eye-candy plugins (alpha,
# fisheye, invert, wobbly, wrot) are intentionally left out.
plugins = \
  animate \
  autostart \
  blur \
  command \
  decoration \
  expo \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  zoom \
  ipc \
  ipc-rules \
  stipc

# Close focused window.
close_top_view = <super> KEY_Q | <alt> KEY_F4

# Workspaces arranged into a grid: 3 × 2.
vwidth = 3
vheight = 2

# Prefer client-side decoration or server-side decoration
preferred_decoration_mode = client

# Keyboard ─────────────────────────────────────────────────────────────────────

[input]

# Left empty on purpose, and it matters that it is written down: wayfire's own
# default for this option is a hardcoded `us`, so a keyboard chosen during the
# installation would never reach the desktop. An empty value is what makes
# libxkbcommon fall back to XKB_DEFAULT_LAYOUT, which vasak-session exports from
# the system keymap (/etc/vconsole.conf, where the installer leaves it).
#
# Configuración → Idioma y teclado writes these; a value here wins over the
# system one. Two layouts go separated by a comma (`es,us`), and xkb_options is
# what gives you a key to switch between them (`grp:alt_shift_toggle`).
xkb_layout =
xkb_variant =
xkb_options =

# Mouse bindings ───────────────────────────────────────────────────────────────

# Drag windows by holding down Super and left mouse button.
[move]
activate = <super> BTN_LEFT

# Resize them with right mouse button + Super.
[resize]
activate = <super> BTN_RIGHT

# Zoom (accessibility magnifier) by scrolling + Super.
[zoom]
modifier = <super>

# Startup commands ─────────────────────────────────────────────────────────────

[autostart]

# Export the session environment (WAYLAND_DISPLAY, DISPLAY, XDG_CURRENT_DESKTOP,
# etc.) to the systemd user manager and the D-Bus activation environment, at the
# right moment (once the compositor is up). Replaces the old manual
# dbus-update-activation-environment call. Required by uwsm.
0_env = uwsm finalize
desktop = vasak-desktop

# El bloqueo por inactividad lo administra systemd (vasak-idle.service), no
# wayfire: se configura desde vasak-settings > Energía. session-lock (el lado
# del compositor) sigue habilitado en [core].

# Output configuration
# https://wayland.emersion.fr/kanshi/
#outputs = kanshi

# The desktop portal is not autostarted: it is D-Bus activated, so the first
# application that needs a file picker starts it. The line that used to be here
# pointed at /usr/libexec, which does not exist on Arch at all — so it never
# started anything, and looked like it did.

# Applications ─────────────────────────────────────────────────────────────────

[command]

# Volume (PipeWire).
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screen brightness.
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl set +5%
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl set 5%-

# Applications & actions.
binding_terminal = <super> KEY_T
command_terminal = vasak-terminal
binding_terminal_alt = <alt> <ctrl> KEY_T
command_terminal_alt = vasak-terminal
binding_files = <super> KEY_E
command_files = vasak-file-manager
binding_menu = <super>
command_menu = dbus-send --session --dest=org.vasak.os.Desktop --type=method_call /org/vasak/os/Desktop org.vasak.os.Desktop.OpenMenu
binding_lock = <super> KEY_L
command_lock = gtklock -s /usr/share/vasak/gtklock.css

# Screenshots (grim/slurp) — enable once a screenshot tool is shipped:
#binding_screenshot = KEY_PRINT
#command_screenshot = grim $(date '+%F_%T').webp

# Windows ──────────────────────────────────────────────────────────────────────

# Actions related to window management functionalities.
#
# Example configuration:
#
# [wm-actions]
# toggle_fullscreen = <super> KEY_F
# toggle_always_on_top = <super> KEY_X
# toggle_sticky = <super> <shift> KEY_X

[grid]

duration = 150
type = regular

#
# ⇱ ↑ ⇲   │ 7 8 9
# ← f →   │ 4 5 6
# ⇱ ↓ ⇲ d │ 1 2 3 0
# ‾   ‾
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
# Restore default.
restore = <super> KEY_DOWN | <super> KEY_KP0

# Change active window with an animation.
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

# Simple active window switcher.
[fast-switcher]
activate = <alt> KEY_ESC

# Workspaces ───────────────────────────────────────────────────────────────────

# Switch to workspace.
[vswitch]
# Move the focused window with the same key-bindings, but add Shift.

# Show an overview of all workspaces.
binding_down = <ctrl> <super> KEY_DOWN
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
duration = 300
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
with_win_up = <ctrl> <super> <shift> KEY_UP
wraparound = false
[expo]
# Select a workspace.
# Workspaces are arranged into a grid.
# See core.vwidth and core.vheight for configuring the grid.
duration = 300
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9
toggle = <super> KEY_G
[oswitch]
# Switch to the next output.
next_output = <super> KEY_O
# Same with the window.
next_output_with_win = <super> <shift> KEY_O

# Send toggle menu event.
[wayfire-shell]
toggle_menu = <super>

# Rules ────────────────────────────────────────────────────────────────────────

[window-rules]
# skip_taskbar is set via IPC (set_view_property) in vasak-desktop
# Requires ipc-rules plugin (already loaded in core/plugins)

[decoration]

active_color = #222222aa
border_radius = 10
border_size = 4
button_order = minimize maximize close
font = sans-serif
ignore_views = none
inactive_color = #333333dd
title_height = 20

[blur]
method = kawase
blur_by_default = all
iterations = 5
offset = 2

[animate]
close_animation = fade
duration = 150
open_animation = fade
