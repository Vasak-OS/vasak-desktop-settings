[Settings]
gtk-application-prefer-dark-theme=true
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Noto Sans 11
gtk-primary-button-warps-slider=false
gtk-icon-theme-name=VasakOS-dark

# Cómo se dibuja el texto. Sin estas cuatro, cada aplicación GTK resolvía por su
# cuenta y no coincidía con lo que el portal informa a las que están aisladas.
#
# `hintslight` es el mismo que ya trae fontconfig en Arch, y es el que conserva
# la forma de la letra en lugar de encajarla a la fuerza en la grilla de píxeles:
# se lee más suave, que es lo que se busca acá.
#
# `rgba=none` a propósito. El subpíxel afina el texto en un panel LCD de franjas
# RGB y le mete franjas de color en uno rotado, en OLED o en HiDPI, donde además
# no hace falta. Es una decisión por pantalla y no un valor bueno para todas.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
