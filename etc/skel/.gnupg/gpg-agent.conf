# Quién pide la contraseña cuando GPG la necesita.
#
# Sin esta línea, `gpg-agent` usa `/usr/bin/pinentry`, el envoltorio de Arch,
# que elige entre el de GTK, el de Qt y el de curses según lo que encuentre
# instalado. O sea que el diálogo más delicado del escritorio —el que pide la
# frase de una clave privada— era el único que no se parecía al resto, y
# cambiaba de aspecto según qué paquetes hubiera.
#
# `vasak-pinentry` lo trae `vasak-keyring`. Habla el mismo protocolo y usa la
# misma ventana que el diálogo del llavero y el de las claves SSH.
#
# Si el paquete no estuviera, `gpg-agent` no cae al envoltorio: falla el pedido
# entero. Por eso la dependencia está declarada y no es opcional.
pinentry-program /usr/bin/vasak-pinentry
