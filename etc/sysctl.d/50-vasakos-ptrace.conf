# Que un proceso no pueda leerle la memoria a otro de la misma persona.
#
# Con `ptrace_scope=1` (yama) sólo un ancestro puede depurar a un proceso: un
# programa cualquiera no puede hacer `gdb -p` sobre el sincronizador de cuentas
# ni leer su `/proc/<pid>/mem`, donde están la clave de cada base abierta y los
# tokens. El núcleo de Arch ya lo trae así; se fija acá para que no dependa de
# esa decisión ajena. Antes el sincronizador se cerraba solo con
# `PR_SET_DUMPABLE`, pero eso le impedía identificarse ante vasak-keyring
# (`vasak-accounts#131`).
#
# Qué cuesta: depurar un proceso ya corriendo pide `sudo` (o lanzarlo desde el
# depurador), igual que en Ubuntu y Fedora.
kernel.yama.ptrace_scope = 1
