# Endurecimiento de red para un escritorio.
#
# Un escritorio no es un router ni una pasarela, así que varios defaults del
# kernel —pensados para equipos que reenvían tráfico— acá sólo abren superficie.
# Se fijan en este archivo, y no se dejan al upstream, por el mismo motivo que
# `ptrace_scope`: que no dependan de la decisión de otro paquete. En los equipos
# que vienen de CachyOS varios de estos venían de `cachyos-settings`, que VasakOS
# no exige; en una instalación limpia no estarían.
#
# ── ICMP redirects ───────────────────────────────────────────────────────────
#
# Un redirect es «para esa IP mandá por este otro gateway». Aceptarlos deja que
# alguien en la red reescriba la tabla de rutas del equipo (MITM); emitirlos sólo
# tiene sentido en un router. Un escritorio no hace ninguna de las dos cosas.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ── Reverse path filtering ─────────────────────────────────────────────────────
#
# El kernel descarta el paquete cuyo origen no volvería por la interfaz por la
# que entró: el filtro clásico contra IPs falsificadas. `1` es el modo estricto.
#
# Costo: rompe el enrutamiento asimétrico (multi-homing, algunas VPN). Si eso
# aparece, el arreglo es bajarlo a `2` (modo laxo), que sigue filtrando lo obvio.
# En un escritorio de una sola interfaz activa el estricto no molesta.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ── Paquetes marcianos ─────────────────────────────────────────────────────────
#
# Un paquete con origen imposible para la interfaz por la que llegó. Anotarlos no
# los bloquea, pero deja rastro de un intento de falsificación. El volumen en un
# escritorio normal es despreciable.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ── Volcados de memoria de procesos setuid ─────────────────────────────────────
#
# Un proceso que cambió de privilegio (setuid) y se cae no debe dejar un core:
# tendría memoria que el usuario que lo lanzó no podría leer de otro modo
# —claves, hashes—. `0` es no volcar ninguno.
fs.suid_dumpable = 0
