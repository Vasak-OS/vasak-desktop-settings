# Que las denegaciones de AppArmor lleguen al servicio de permisos.
#
# ── Qué pasaba ───────────────────────────────────────────────────────────────
#
# El servicio de permisos se entera de que algo se bloqueó leyendo `/dev/kmsg`,
# y ahí los registros de auditoría pasan por `printk`, que viene limitado: cinco
# mensajes por intervalo, con ráfaga de diez. Lo que sobra el kernel lo tira y
# lo anuncia así:
#
#     kauditd_printk_skb: 126 callbacks suppressed
#
# Medido en un escritorio, dos horas y cuarto de sesión normal:
#
#     registros descartados   42410
#     registros que pasaron    1672   (96% de pérdida)
#       de ellos, ALLOWED      1598   (perfiles en modo aviso)
#       de ellos, DENIED          1
#
# Los mil quinientos noventa y ocho «ALLOWED» son el ruido de los perfiles del
# sistema en modo aviso, que anotan todo lo que habrían bloqueado. Ese ruido se
# come el cupo, y lo que se pierde en el medio son las denegaciones de verdad.
#
# Eso rompe las dos cosas que dependen del registro. Una denegación que el
# kernel descarta no llega al servicio, así que no sale el aviso y nadie recibe
# la oferta de desbloquear — que es justamente la regla del escritorio: todo lo
# que se bloquea se tiene que poder desbloquear. Y la semana de diario en modo
# aviso, que es de donde va a salir qué perfiles pasan a bloquear de verdad,
# estaría leyendo una muestra del 4% y sesgada hacia lo que más se repite.
#
# ── Qué cuesta ───────────────────────────────────────────────────────────────
#
# El anillo de mensajes del kernel se llena mucho más rápido, así que un error
# de hardware puede quedar tapado antes de que alguien lo mire. Es un costo
# sobre todo mientras dure el modo aviso: cuando la tanda que bloquea de verdad
# esté decidida y los perfiles ruidosos dejen de anotar, el volumen baja solo —
# en régimen, una denegación es un hecho raro.
#
# La solución de fondo es que el servicio no lea `printk` sino el socket de
# auditoría del kernel, que no pasa por este cupo. Eso es otro trabajo.
kernel.printk_ratelimit = 0
