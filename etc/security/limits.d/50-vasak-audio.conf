# Prioridad de tiempo real para el audio.
#
# ── Qué pasa sin esto ───────────────────────────────────────────────────────
#
# Los hilos de datos de PipeWire, WirePlumber y pipewire-pulse corren en
# SCHED_OTHER en vez de SCHED_FIFO, y el audio se corta cuando la máquina está
# ocupada — compilando, abriendo un navegador—. No falla: chasquea, y el
# síntoma no se parece a su causa.
#
# `module-rt` de PipeWire pide `rt.prio = 88` y lo consigue **sólo si el
# proceso tiene el límite**. Medido acá:
#
#   systemctl show -p DefaultLimitRTPRIO  →  0
#
# o sea que systemd no da nada por omisión. El límite entra por `pam_limits` al
# iniciar sesión, lo hereda el gestor de usuario y de ahí los servicios.
#
# ── Por qué lo ponemos nosotros ─────────────────────────────────────────────
#
# Porque hasta ahora venía de `cachyos-settings`, que **no lo exige nadie**: no
# está en `archiso/packages.x86_64`, no lo instala vasak-installer y ningún
# paquete nuestro depende de él. En los equipos que vienen de CachyOS está por
# herencia; en una instalación limpia de VasakOS no estaría, y el audio
# chasquearía sin que nada lo explicara.
#
# Se escribe acá y no se agrega una dependencia a `cachyos-settings` porque ese
# paquete trae muchas otras decisiones que no son nuestras. Y no se usa
# `realtime-privileges` —que sería lo canónico de Arch— porque su archivo
# concede al grupo `realtime`, que vasak-installer no crea ni asigna: haría
# falta tocar también el instalador y sólo arreglaría las instalaciones nuevas.
# El grupo `audio` ya lo pone el instalador a todo usuario, administrador o no,
# así que esto arregla también lo ya instalado.
#
# ── Por qué 95 y no 99 ──────────────────────────────────────────────────────
#
# Lo más alto que pide la pila es 88, el hilo de datos de PipeWire; WirePlumber
# y pipewire-pulse piden 83. Con 95 sobra margen para eso y para un cliente
# JACK, y no se reparte el techo. `cachyos-settings` concede 99; no hay motivo
# medido para llegar ahí, y conceder de más en un límite que gobierna la
# planificación es lo que este archivo trata de acotar.
#
# ── Lo que a propósito NO se concede ────────────────────────────────────────
#
# `memlock unlimited`, que es lo que suele acompañar a estas recetas. PipeWire
# corre con el límite por omisión —8 MiB— sin quejarse, y conceder memoria
# bloqueada sin tope a todo el grupo `audio` deja que cualquier programa fije
# toda la RAM. Se agrega el día que haya una medición que lo pida, con el
# número que esa medición diga.
#
# Y tampoco `rtkit`: PipeWire lo usa como alternativa cuando **no** tiene el
# límite, y teniéndolo es un demonio y una vuelta por D-Bus que no hacen falta.

@audio   -   rtprio   95
@audio   -   nice     -11
