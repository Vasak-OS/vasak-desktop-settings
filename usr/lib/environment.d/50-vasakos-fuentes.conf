# Cómo dibuja FreeType los trazos de la letra.
#
# El «stem darkening» engrosa los trazos según el tamaño en que se dibujan, en
# lugar de dejarlos del grosor que salga de la rasterización. Es lo que hace que
# el texto se lea más lleno y menos desvaído, sobre todo en cuerpos chicos y en
# pantallas sin mucha densidad. Es también el corazón de lo que hacen los
# proyectos de «mejora de fuentes» que andan dando vueltas: acá no hace falta
# ninguno, porque son dos propiedades de FreeType y esto es un paquete nuestro.
#
# Va apagado de fábrica en FreeType porque, para verse como corresponde, quiere
# mezcla con corrección de gamma; sin eso puede quedar algo pesado. Por eso es
# una preferencia y no una decisión nuestra: Ajustes → Apariencia → Fuentes lo
# apaga escribiendo un archivo con este mismo nombre en la carpeta del usuario,
# que enmascara a éste.
#
# `autofitter` es el que importa: con `hintslight` —el hinting que usa el
# escritorio— las fuentes TrueType como Noto Sans y MesloLGL se rasterizan por
# el autofitter, no por el intérprete de TrueType. `cff` va también para las
# PostScript, que es donde FreeType estrenó la propiedad.
#
# Sólo lo toman los procesos que arrancan después: FreeType lee esto al
# inicializarse. Lo que ya está abierto sigue dibujando como antes hasta que se
# vuelve a abrir la sesión.
FREETYPE_PROPERTIES=cff:no-stem-darkening=0 autofitter:no-stem-darkening=0
