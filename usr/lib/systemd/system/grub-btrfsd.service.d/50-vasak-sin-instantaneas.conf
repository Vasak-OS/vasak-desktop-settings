# No arrancar el vigilante de instantáneas si todavía no hay instantáneas.
#
# `grub-btrfsd` hace `ExecStart=/usr/bin/grub-btrfsd --syslog /.snapshots`: se
# queda mirando ese directorio con inotify y se cae si no existe. En un sistema
# recién instalado no existe hasta la primera instantánea, así que la unidad
# arranca, falla, y queda en `systemctl --failed` desde el primer arranque.
#
# Eso no rompe nada, y por eso importa: `systemctl --failed` es lo primero que
# se mira cuando algo anda mal, y un fallo que está desde siempre deja de
# leerse. El día que aparezca uno de verdad va a estar al lado de éste,
# indistinguible. Ya pasó diagnosticando la pantalla negra del medio en vivo
# —Vasak-OS/archiso#3—, donde hubo que descartarlo a mano antes de poder mirar
# lo demás.
#
# `ConditionPathExists` no es un error: si no se cumple, systemd salta la
# unidad y la deja como «inactiva (condición no alcanzada)», que es exactamente
# lo que corresponde. Cuando aparezca `/.snapshots` —la primera instantánea, o
# el primer arranque después de configurarlas— la condición se cumple y la
# unidad arranca sola.
#
# El medio en vivo tiene su propia mitad de esto: ahí va enmascarada, porque no
# hay ningún GRUB instalado cuya configuración regenerar. Ver Vasak-OS/archiso#8.
[Unit]
ConditionPathExists=/.snapshots
