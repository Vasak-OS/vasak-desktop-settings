# El portal entra por el socket privilegiado de PipeWire.
#
# Sin esto, `50-vasak-camara.conf` deja al portal sin cámara junto con todos los
# demás, y el camino que pregunta —el único que puede conceder— queda tan
# cerrado como el que no pregunta. O sea: bloquear sin poder desbloquear, que es
# justo lo que el escritorio no hace.
#
# Alcanza con el entorno del proceso del portal, y eso cubre las dos conexiones
# que abre, que es lo que hace que esto funcione:
#
#   · la suya, con la que vigila qué cámaras hay y contesta `IsCameraPresent`;
#   · **y la que le fabrica a cada aplicación** en `OpenPipeWireRemote`, cuyo
#     descriptor le pasa por D-Bus. Las dos salen de `pipewire_remote_new_sync`,
#     que toma el remoto por omisión del entorno, así que las dos entran por el
#     privilegiado.
#
# Sobre esa segunda conexión el portal deniega todo —`PW_ID_ANY` a cero, en
# `src/camera.c`— y deja que la reconceda WirePlumber según el almacén de
# permisos del portal. Quien lo hace es `find-portal-access.lua`, que empareja
# los nodos con `media.role = Camera` y consulta ese almacén. Está activo en una
# sesión de usuario: `script.client.access-portal = disabled` en el archivo de
# WirePlumber vive dentro del bloque `mixin.systemwide-session`, que a una
# sesión de usuario no se le aplica. Comprobado mirando
# `pipewire.access.portal.gate-supported` en el cliente de WirePlumber, que sólo
# se pone si el script cargó.
#
# ⚠ Al actualizar en una sesión ya iniciada hay que recargar y reiniciar el
# servicio; el drop-in solo no basta:
#
#     systemctl --user daemon-reload && systemctl --user restart xdg-desktop-portal

[Service]
Environment=PIPEWIRE_REMOTE=pipewire-0-priv
