# El socket privilegiado de PipeWire.
#
# Los sockets de PipeWire no los crea PipeWire: los crea systemd y se los pasa
# al daemon por activación por socket. El daemon los reconoce **por nombre**
# contra su propia lista —«Found socket activation socket for '%s'»—, así que
# hacen falta las dos piezas y ninguna sola alcanza:
#
#   · esta línea, para que systemd cree el socket y lo pase, y
#   · la entrada correspondiente en /etc/pipewire/pipewire.conf, que genera
#     /usr/lib/vasak/generar-pipewire-conf.
#
# Comprobado: con las dos, un cliente conecta y el servidor lo ve con
# `pipewire.sec.socket = pipewire-0-priv`. Con sólo una de las dos, no.
#
# Ese `pipewire.sec.socket` es el punto de todo esto: lo fija el servidor a
# partir de las credenciales de la conexión, o sea que el cliente **no puede
# mentir** sobre por dónde entró. Es el único discriminador confiable que ofrece
# PipeWire —lo que la aplicación dice de sí misma, como su propio binario, sí es
# falsificable—, y es sobre el que se van a escribir las reglas que decidan
# quién puede usar la cámara y el micrófono.
#
# ⚠ Al actualizar en una sesión ya iniciada, `systemctl --user daemon-reload` NO
# alcanza: hay que reiniciar la unidad de socket. systemd lo dice en el diario
# —«Unit configuration changed while unit was running… Unit not fully functional
# until restarted»— y el socket no aparece hasta entonces. En un arranque limpio
# no hay nada que hacer.
[Socket]
ListenStream=%t/pipewire-0-priv
