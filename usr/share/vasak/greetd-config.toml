# VasakOS greetd configuration (reference for INSTALLED systems).
#
# The `greetd` package owns /etc/greetd/config.toml, so this canonical config is
# shipped here rather than at that path, to avoid a pacman file conflict.
#
# Copying it into place is not this package's job: `vasak-session-manager`'s
# install hook owns that, and it ships its own reference at
# /usr/share/vasak-session-manager/greetd.toml. That hook is the one that knows
# when replacing the file is safe -- it leaves a config somebody wrote by hand
# alone, and only overwrites what is missing, still greetd's `agreety` default,
# or an autologin naming a user that does not exist.
#
# To auto-unlock the vasak keyring at login, also add to /etc/pam.d/greetd:
#     auth       optional  pam_vasak_keyring.so
#     session    optional  pam_vasak_keyring.so

[terminal]
vt = 7

# The greeter: the Tauri UI hosted in cage, run as the unprivileged `greeter`
# user that the greetd package provides.
[default_session]
command = "/usr/bin/vasak-session-manager-launch"
user = "greeter"
