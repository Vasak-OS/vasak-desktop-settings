# Qué backend atiende cada portal en VasakOS.
#
# Sin este archivo el portal no elige: cae en «last-resort fallback» y toma el
# primero que encuentra. En una máquina con el portal de GTK y el de KDE
# instalados —que es el caso, porque los arrastran otras dependencias— eso
# significaba que **el diálogo de permisos de VasakOS no se usaba nunca**. En el
# diario del arranque se leía tal cual:
#
#   Choosing gtk.portal for org.freedesktop.impl.portal.Access as a last-resort
#   fallback
#
# El agente estaba instalado, corriendo y con su nombre tomado en el bus. El
# portal simplemente no le preguntaba. Con este archivo, los once «last-resort
# fallback» del arranque pasaron a cero.
#
# El nombre del archivo no es decorativo: el portal lo busca por cada entrada de
# XDG_CURRENT_DESKTOP, en minúsculas y con el sufijo `-portals.conf`. La sesión
# declara `Vasak`, así que tiene que llamarse `vasak-portals.conf` y ningún otro.

[preferred]
# Primero GTK, que es el que implementa los diálogos de archivo, impresión y
# compañía con el aspecto que las aplicaciones esperan. Después wlr y KDE, para
# no dejar sin implementación las interfaces que sólo ellos traen —captura
# remota, atajos globales, portapapeles—: sin nombrarlos, esas quedarían muertas.
default=gtk;wlr;kde

# El diálogo de permisos es de VasakOS. Es el único que consulta al servicio de
# permisos y el que se ve como el resto del escritorio.
org.freedesktop.impl.portal.Access=vasak

# La captura de pantalla la atiende xdg-desktop-portal-wlr, que es el que sabe
# capturar la salida de un compositor wlroots. Explícito y no por descarte: el
# de KDE también las declara, y elegirlo traería diálogos de Plasma —y en el
# mejor de los casos no funcionaría, porque habla con KWin.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# Ninguno, y a propósito.
#
# El único backend instalado que implementa esta interfaz es el de KWallet, que
# guardaría los secretos de las aplicaciones en una cartera de KDE que nada más
# del sistema lee — mientras vasak-keyring, que es el llavero del escritorio,
# queda de lado. Un secreto guardado en el lugar equivocado es peor que uno que
# no se pudo guardar: el segundo se nota.
#
# Lo correcto es que vasak-keyring implemente `org.freedesktop.impl.portal.Secret`
# y que acá diga `vasak`. Hasta entonces, `none`.
org.freedesktop.impl.portal.Secret=none
