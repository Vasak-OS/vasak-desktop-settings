# Qué backend atiende cada portal en VasakOS.
#
# Sin este archivo el portal no elige: cae en «last-resort fallback» y toma el
# primero que encuentra. En una máquina con el portal de GTK y el de KDE
# instalados —que es el caso, porque los arrastran otras dependencias— eso
# significaba que **el diálogo de permisos de VasakOS no se usaba nunca**. En el
# diario del arranque se leía tal cual:
#
#   Choosing gtk.portal for org.freedesktop.impl.portal.Access as a last-resort
#   fallback
#
# El agente estaba instalado, corriendo y con su nombre tomado en el bus. El
# portal simplemente no le preguntaba. Con este archivo, los once «last-resort
# fallback» del arranque pasaron a cero.
#
# El nombre del archivo no es decorativo: el portal lo busca por cada entrada de
# XDG_CURRENT_DESKTOP, en minúsculas y con el sufijo `-portals.conf`. La sesión
# declara `Vasak`, así que tiene que llamarse `vasak-portals.conf` y ningún otro.

[preferred]
# Primero GTK, que es el que implementa los diálogos de archivo, impresión y
# compañía con el aspecto que las aplicaciones esperan. Después wlr y KDE, para
# no dejar sin implementación las interfaces que sólo ellos traen —captura
# remota, atajos globales, portapapeles—: sin nombrarlos, esas quedarían muertas.
default=gtk;wlr;kde

# El diálogo de permisos es de VasakOS. Es el único que consulta al servicio de
# permisos y el que se ve como el resto del escritorio.
org.freedesktop.impl.portal.Access=vasak

# La captura de pantalla la pregunta VasakOS y la hace wlr.
#
# El backend de VasakOS no captura: muestra el diálogo de permiso y reenvía todo
# a xdg-desktop-portal-wlr, que es el que sabe capturar la salida de un
# compositor wlroots. Está en el medio porque wlr no tiene diálogo de permiso
# —sólo un selector de monitor, que no dice qué aplicación pide, no se recuerda
# y no se puede revocar—, así que apuntando directo a wlr una aplicación que
# pedía capturar la pantalla la recibía sin que se le preguntara nada a nadie.
#
# Si el agente no está corriendo, el portal lo arranca por activación de D-Bus.
org.freedesktop.impl.portal.ScreenCast=vasak;wlr

# Las capturas sueltas siguen siendo de wlr, sin preguntar: las dispara la
# persona con una tecla, no una aplicación a sus espaldas. Explícito y no por
# descarte: el de KDE también las declara, y elegirlo traería diálogos de Plasma
# —y en el mejor de los casos no funcionaría, porque habla con KWin.
org.freedesktop.impl.portal.Screenshot=wlr

# El secreto maestro por aplicación lo da vasak-keyring, que es el llavero del
# escritorio.
#
# Estuvo en `none` un rato, y a propósito: el único backend instalado que
# implementa esta interfaz era el de KWallet, que habría guardado los secretos de
# las aplicaciones en una cartera de KDE que nada más del sistema lee, mientras el
# llavero propio quedaba de lado. Un secreto guardado en el lugar equivocado es
# peor que uno que no se pudo guardar: el segundo se nota.
org.freedesktop.impl.portal.Secret=vasak-keyring
