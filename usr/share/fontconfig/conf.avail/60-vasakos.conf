<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Lo que fontconfig tiene que saber de VasakOS, y nada más.

  Los valores de renderizado —antialias, `hintslight`, el filtro LCD— ya los
  trae Arch en su propia `conf.d` y son los que queremos, así que acá no se
  repiten: una regla que dice lo mismo que la de al lado es una que alguien va a
  cambiar creyendo que hace algo.

  Lo que sí falta es la familia monoespaciada. `sans-serif` y `serif` ya caen en
  Noto por `46-noto-sans.conf` y `46-noto-serif.conf`, que Arch envía; pero
  `monospace` cae en «Noto Sans Mono», y el escritorio declara MesloLGL en
  `vasak.conf` y en el esquema de GSettings. O sea que una aplicación que pide la
  monoespaciada genérica —un editor, un visor de código, una página web con
  `font-family: monospace`— se veía con otra letra que la terminal.

  Es el mismo desajuste que se arregló en los tres archivos de configuración,
  un piso más abajo: ahí decidimos qué fuente nombramos, y acá qué recibe quien
  no nombra ninguna.
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>MesloLGL Nerd Font Mono</family>
    </prefer>
  </alias>

  <!--
    Suavizado en gris y no por subpíxel.

    Ya lo decíamos en `99_vasakos-settings.gschema.override`
    (`font-antialiasing='grayscale'`), pero eso alcanza a las aplicaciones GTK y
    a las que preguntan por el portal. El resto —Qt, Java, lo que dibuje con
    FreeType por su cuenta— no se entera y toma lo que haya, que en la mayoría
    de los equipos termina siendo subpíxel.

    El subpíxel supone que los tres componentes del píxel están en un orden
    conocido, y eso deja de ser cierto apenas la pantalla se gira, en un panel
    OLED con disposición distinta, o compartiendo pantalla —donde lo que se
    manda son los colores de los bordes de las letras, que del otro lado se ven
    como flecos—. En gris no hay nada que suponer.

    `append` y no `assign`, que es lo mismo que hace Arch con el filtro LCD unas
    reglas más arriba: al leer la propiedad se toma el primer valor, así que
    esto sólo gana cuando nadie más dijo nada. Una aplicación que pide subpíxel
    a propósito lo sigue teniendo.
  -->
  <match target="pattern">
    <edit mode="append" name="rgba">
      <const>none</const>
    </edit>
  </match>
</fontconfig>
