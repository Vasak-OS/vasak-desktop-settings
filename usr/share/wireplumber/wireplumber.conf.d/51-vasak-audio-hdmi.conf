# La salida de audio por HDMI, disponible apenas se conecta el monitor.
#
# ── Qué hace ────────────────────────────────────────────────────────────────
#
# Una tarjeta de audio sólo publica un *sink* por cada salida que el perfil
# activo expone. La salida HDMI de la GPU casi siempre vive en su propia
# tarjeta ALSA, que de fábrica arranca en el perfil `off` —no hay monitor que
# ofrezca audio hasta que se enchufa uno—. Al conectar el monitor en caliente,
# WirePlumber ve que aparece la ruta de salida HDMI pero no cambia el perfil
# solo: la tarjeta sigue en `off`, el sink HDMI nunca se crea y en el panel de
# sonido no hay nada que elegir. Ese es el bug de vasak-desktop#230.
#
# Este archivo declara una preferencia de perfiles para las tarjetas ALSA: en
# cuanto una salida HDMI pasa a estar disponible, el perfil que la expone es el
# que se activa, así que el sink HDMI aparece y se puede seleccionar.
#
# ── Cómo, y por qué es la clave de 0.5 ──────────────────────────────────────
#
# WirePlumber 0.5 elige el perfil de cada dispositivo con una cadena de hooks
# sobre el evento `select-profile`, en este orden:
#
#   1. `device/find-stored-profile`   — restaura el que el usuario eligió a mano
#   2. `device/find-preferred-profile`— lee ESTA sección de configuración
#   3. `device/find-best-profile`     — puntúa por las rutas de salida reales
#
# `find-preferred-profile.lua` lee la sección `device.profile.priority.rules`:
# para cada dispositivo que casa, toma la lista `priorities` y activa el PRIMER
# perfil de la lista que esté disponible (`available ≠ "no"`). Esa condición es
# lo que convierte una simple lista de preferencias en un «conmutar al conectar»:
#
#   * sin monitor, los perfiles HDMI están `available = "no"` y se saltan todos
#     → el hook no elige nada y la decisión cae en `find-best-profile`, que deja
#     el audio analógico / integrado como estaba. Este archivo NO hace nada.
#   * con monitor, la ruta HDMI pasa a `available = "yes"`, el cambio de
#     `EnumProfile` vuelve a disparar `select-profile` (lo hace
#     `device/select-profile-on-device-enumprofile-changed`), y ahora sí el
#     primer perfil HDMI de la lista está disponible y se activa.
#
# El disparo en caliente ya lo da WirePlumber; lo único que faltaba era decirle
# que, cuando el HDMI está, es lo que se prefiere.
#
# ── Qué NO rompe ─────────────────────────────────────────────────────────────
#
# 1. **El analógico y el micrófono.** La lista sólo nombra perfiles de salida
#    HDMI. En la tarjeta del códec analógico ninguno de esos nombres existe como
#    perfil disponible, así que `find-preferred-profile` no elige nada ahí y esa
#    tarjeta queda intacta.
#
# 2. **La elección manual.** `find-stored-profile` corre ANTES que éste: si
#    quien usa el equipo fijó un perfil a mano y sigue disponible, ese gana y
#    esta preferencia ni se evalúa. No le pisamos la decisión a nadie.
#
# 3. **El Bluetooth.** El match es sólo `device.api = "alsa"`; los dispositivos
#    `bluez5` eligen su perfil por otra vía (`bluetooth.profile-preference`) y
#    no los tocamos.
#
# 4. **El sink por omisión.** Esto hace que el sink HDMI EXISTA y se pueda
#    elegir —que es lo que pedía #230—, no que el audio salte solo al HDMI al
#    enchufar el monitor. Mover el sink por omisión es otra política (nodos por
#    omisión) y queda fuera de este archivo a propósito.
#
# ── Tarjeta combinada (analógico + HDMI en la misma tarjeta ALSA) ───────────
#
# En el caso poco común de una tarjeta que trae el analógico y el HDMI juntos y
# no puede exponer los dos sinks a la vez, al conectar el monitor se activa el
# perfil HDMI y el analógico de esa tarjeta se va mientras el monitor siga
# enchufado. Es inevitable por hardware —esa tarjeta no puede con las dos
# salidas a la vez— y quien prefiera el analógico lo elige a mano, con lo que
# `find-stored-profile` lo recuerda (ver punto 2). Las tarjetas que sí exponen
# un perfil combinado las resuelve `find-best-profile`, que puntúa por cuántas
# rutas de salida utilizables ofrece cada perfil.
#
# ── Si esto molesta ──────────────────────────────────────────────────────────
#
# Un archivo en `~/.config/wireplumber/wireplumber.conf.d/` con la sección vacía
# devuelve el comportamiento de fábrica sin desinstalar nada:
#
#     device.profile.priority.rules = [ ]
#
# Validación en hardware real, con el monitor HDMI conectado:
#
#     pactl list cards  | grep -A2 'Active Profile'   # el perfil activo nombra hdmi
#     pactl list sinks short                           # aparece el sink hdmi
#
# Los nombres `output:hdmi-*` son los que ALSA/PipeWire da a las salidas HDMI;
# `-extra1`..`-extra3` son el 2.º, 3.º y 4.º conector HDMI/DP de la misma
# tarjeta, para el que conecta el monitor a algo que no es la primera salida.

device.profile.priority.rules = [
  {
    matches = [
      { device.api = "alsa" }
    ]
    actions = {
      update-props = {
        # Se prueban en orden y gana el primero disponible. Estéreo antes que
        # envolvente: es la que suena en cualquier monitor; la envolvente queda
        # para quien tenga un receptor que la ofrezca.
        priorities = [
          "output:hdmi-stereo"
          "output:hdmi-stereo-extra1"
          "output:hdmi-stereo-extra2"
          "output:hdmi-stereo-extra3"
          "output:hdmi-surround"
          "output:hdmi-surround-extra1"
          "output:hdmi-surround-extra2"
          "output:hdmi-surround-extra3"
          "output:hdmi-surround71"
          "output:hdmi-surround71-extra1"
          "output:hdmi-surround71-extra2"
          "output:hdmi-surround71-extra3"
        ]
      }
    }
  }
]
