# La cámara, sólo por el camino que pregunta.
#
# ── Qué hace ────────────────────────────────────────────────────────────────
#
# Los objetos de cámara de PipeWire dejan de ofrecerse a los clientes que
# entran por el socket normal, `pipewire-0`, que es por donde entra cualquier
# aplicación. Para esos clientes la cámara no existe: no la ven en el registro,
# así que no la pueden enlazar.
#
# La aplicación que quiera la cámara la pide por `xdg-desktop-portal`, que sí
# pregunta —el diálogo lo atiende el backend de VasakOS, que consulta y anota
# en `vasak-permissions`— y que corre sobre el socket privilegiado. Lo
# concedido se puede revocar después desde Privacidad y seguridad sin relanzar
# nada: WirePlumber vuelve a calcular los permisos cuando el almacén del portal
# cambia.
#
# ── Qué NO hace, que importa tanto como lo anterior ─────────────────────────
#
# 1. **No cierra `/dev/video0`.** Una aplicación que abra el dispositivo a mano
#    no pasa por PipeWire y esto no la toca. Esa vía la cubre AppArmor, hoy
#    sólo para los AppImage de la carpeta del usuario.
#
# 2. **No impide elegir la otra puerta.** `/run/user/*/pipewire-0-priv` es
#    `srw-rw-rw-`, como todos los sockets de PipeWire, así que un proceso del
#    usuario que ponga `PIPEWIRE_REMOTE=pipewire-0-priv` entra por el
#    privilegiado y ve la cámara. El socket dice de forma confiable **por dónde
#    entraste** —lo fija el servidor— pero no impide **elegir por dónde entrar**.
#    Para los AppImage esa puerta la cierra el perfil `vasak-appimage`; para lo
#    demás, no hay quien la cierre con configuración sola.
#
#    Cerrarla de verdad pide resolver `pipewire.sec.pid` —el único discriminador
#    que el cliente no puede ni falsear ni elegir— contra `/proc/<pid>/exe`, y
#    preguntarle a `vasak-permissions`. El Lua de WirePlumber no tiene `io`, así
#    que eso es un módulo en C, no configuración. Es la misma forma que tomó el
#    control de la pantalla: `permisos-globales`, en `vasak-wayfire-plugins`,
#    saca el pid del `wl_client` por la misma razón.
#
# 3. **No cubre el micrófono.** No hay portal de micrófono, así que ocultar
#    `Audio/Source` sería bloquear sin dejar camino para desbloquear, que es
#    justo lo que el escritorio no hace. Queda para el módulo del punto 2.
#
# ── Si esto rompe algo ──────────────────────────────────────────────────────
#
# Un archivo en `~/.config/wireplumber/wireplumber.conf.d/` con la regla vacía
# devuelve el escritorio a como estaba, sin desinstalar nada:
#
#     access.rules = [ ]
#
# Para eximir a un programa puntual —un OBS, un navegador con
# `WebRtcPipeWireCamera` encendido— sin apagar todo:
#
#     access.rules = [
#       { matches = [ { application.process.binary = "obs" } ]
#         actions = { update-props = { permission_manager_name = "" } } }
#       { matches = [ { pipewire.sec.socket = "pipewire-0" } ]
#         actions = { update-props = { permission_manager_name = "vasak-sin-camara" } } }
#     ]
#
# Ese `application.process.binary` lo declara el propio cliente y es
# falsificable: como excepción sirve, como frontera no. No es peor que el punto
# 2 —quien quiera saltarse esto ya tiene el socket privilegiado— pero conviene
# que esté dicho y no descubierto.

access.permission-managers = [
  {
    name = "vasak-sin-camara"

    # `all` es exactamente lo que da el gestor por defecto
    # (`find-default-access.lua` usa `Perm.ALL`), así que un cliente alcanzado
    # por esta regla no pierde nada salvo lo que las reglas de abajo le quitan.
    # `PW_PERM_ALL` es `rwxm`: la `l` no está incluida, tampoco en el de
    # fábrica. Ver /usr/include/pipewire-0.3/pipewire/permission.h.
    default_permissions = "all"

    rules = [
      {
        matches = [
          # El nodo, que es lo que se enlaza para capturar. `media.role` lo
          # pone el propio PipeWire al crear el nodo desde el dispositivo v4l2;
          # un flujo de captura de pantalla es `Stream/Output/Video` y no lleva
          # rol de cámara, así que compartir pantalla no se toca.
          { media.role = "Camera", media.class = "Video/Source" }

          # Y el dispositivo, que no hace falta para capturar pero enumera las
          # cámaras del equipo con marca y modelo —«BisonCam,NB Pro»—. Acá cae
          # también el bucle v4l2 que publica `vasak-connect` con la cámara del
          # teléfono, que es una cámara igual que las otras.
          { media.class = "Video/Device", device.api = "v4l2" }
        ]
        actions = { set-permissions = "-----" }
      }
    ]
  }
]

access.rules = [
  {
    # `pipewire.sec.socket` lo fija el servidor desde las credenciales de la
    # conexión: el cliente no puede mentir sobre por dónde entró.
    #
    # `pipewire-0-manager` no se nombra acá a propósito: por ahí entra
    # WirePlumber, y restringirse a sí mismo le saca los dispositivos y voltea
    # la pila de audio entera. Probado.
    matches = [ { pipewire.sec.socket = "pipewire-0" } ]
    actions = { update-props = { permission_manager_name = "vasak-sin-camara" } }
  }
]
